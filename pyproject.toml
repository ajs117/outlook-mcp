[project]
name = "outlook-mcp"
version = "0.1.0"
description = "Local MCP server for a personal Outlook.com/Hotmail account, via Microsoft Graph."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.19.0",
    "msal>=1.37.0",
    "httpx>=0.28.0",
]

[project.scripts]
outlook-mcp = "outlook_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
